    .rule {

    .contact a:hover { color: var(--orange); border-color: var(--orange); }
    .contact svg { width: 18px; height: 18px; color: var(--orange); }
    .ltr { direction: ltr; unicode-bidi: embed; }
    footer {

      font-size: .85rem; color: #9aa0ad; border-top: 1px solid var(--line);
      width: min(1100px, 100% - 32px); margin: 0 auto;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .box { animation: none; } }
    @media (max-width: 480px) {
